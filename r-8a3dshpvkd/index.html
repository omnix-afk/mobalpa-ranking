<style>
:root{--bg:#061315;--s1:rgba(17,42,46,.72);--line:rgba(167,201,188,.16);--ink:#EAF2EE;--ink2:#A9C1B9;--ink3:#6F8D86;--oak:#D2AE72;--bad:#F0625E;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#EDF2EF;--s1:rgba(255,255,255,.85);--line:rgba(15,42,45,.12);--ink:#0E2A2D;--ink2:#43625D;--ink3:#78908B;--oak:#94712F;--bad:#C8312D;color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:16px}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(40% 45% at 75% 15%,rgba(30,67,71,.9),transparent 70%),radial-gradient(35% 40% at 15% 90%,rgba(100,157,134,.22),transparent 70%);animation:d 22s ease-in-out infinite alternate;z-index:0}
@keyframes d{to{transform:translate3d(-4%,3%,0) scale(1.06)}}
.box{position:relative;z-index:1;width:min(420px,100%);background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:34px 34px 28px;backdrop-filter:blur(18px);box-shadow:0 40px 90px -40px rgba(0,0,0,.7);animation:in 1s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(8px)}}
.box.out{animation:out .7s cubic-bezier(.6,0,.8,.2) forwards}
@keyframes out{to{opacity:0;transform:scale(1.04);filter:blur(14px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.mark span{display:block;height:38px;aspect-ratio:280/62;background:var(--ink);-webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat}
.lang{display:flex;padding:3px;border-radius:11px;border:1px solid var(--line);gap:2px}
.lang button{width:38px;height:28px;border:0;border-radius:8px;background:none;color:var(--ink3);font:600 12px "Instrument Sans",system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;transition:all .25s var(--ease)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub{color:var(--ink2);margin:22px 0 26px;font-size:15px;line-height:1.45}
label{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px}
.field{position:relative}
input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:0 48px 0 16px;letter-spacing:.04em;transition:border-color .25s}
input:focus{outline:none;border-color:var(--oak)}
.eye{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:none;color:var(--ink3);cursor:pointer;border-radius:10px}
.eye:focus-visible,button:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
.go{margin-top:14px;width:100%;height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;font-size:15px;cursor:pointer;position:relative;overflow:hidden}
.go[disabled]{opacity:.65;cursor:wait}
.go .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--oak);width:0}
.go.busy .bar{animation:load 1.4s var(--ease) infinite}
@keyframes load{0%{width:0;left:0}50%{width:60%;left:20%}100%{width:0;left:100%}}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad)}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important}}
</style>
</head>

  es:{sub:"Resultados comerciales, octubre 2026", lab:"Contraseña", go:"Acceder", eye:"Mostrar contraseña", bad:"Contraseña incorrecta.", wait:"Demasiados intentos. Espere {s} s.", nocrypto:"Este navegador no permite descifrar. Use una versión reciente de Chrome, Edge, Safari o Firefox por https."},
  fr:{sub:"Résultats commerciaux, octobre 2026", lab:"Mot de passe", go:"Accéder", eye:"Afficher le mot de passe", bad:"Mot de passe incorrect.", wait:"Trop de tentatives. Patientez {s} s.", nocrypto:"Ce navigateur ne permet pas le déchiffrement. Utilisez une version récente de Chrome, Edge, Safari ou Firefox en https."}
};
let lang = "es";
try { const l = localStorage.getItem("mb-lang"); if (l === "es" || l === "fr") lang = l; else if ((navigator.language||"").toLowerCase().startsWith("fr")) lang = "fr"; } catch(e) {}
const $ = id => document.getElementById(id);
const f = $("f"), pw = $("pw"), go = $("go"), msg = $("msg");
function paint(){
  const t = TX[lang]; document.documentElement.lang = lang;
  $("tSub").textContent = t.sub; $("tLab").textContent = t.lab; $("tGo").textContent = t.go; $("eye").setAttribute("aria-label", t.eye);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  msg.textContent = "";
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("mb-lang", lang); } catch(e) {} paint(); pw.focus(); });

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let fails = 0, lockedUntil = 0;
$("eye").onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; pw.focus(); };
